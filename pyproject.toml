[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "message-relay-kit"
version = "1.0.0"
description = "Message delivery summaries and numeric display smoke tests"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
message-relay-kit = "message_relay_kit.cli:main"

[tool.setuptools]
packages = ["message_relay_kit"]
