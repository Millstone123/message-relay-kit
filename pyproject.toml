[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "message-relay-kit"
version = "0.1.0"
description = "Aggregate bundled delivery events and render a local report"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
message-relay = "message_relay_kit.cli:main"

[tool.setuptools]
packages = ["message_relay_kit"]

[tool.setuptools.package-data]
message_relay_kit = ["../data/*.json", "../resources/*.html"]
